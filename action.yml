name: FBM G-code Safety Analyzer
description: Run conservative static checks on a G-code file.
inputs:
  paths:
    description: Newline-separated G-code paths or glob patterns, relative to the repository root.
    required: true
  profile:
    description: Optional path to a version 1 TOML machine profile.
    required: false
    default: ""
  format:
    description: Output format (console, json, or sarif).
    required: false
    default: console
  fail-on:
    description: Failure threshold (error, warning, or never).
    required: false
    default: error
runs:
  using: composite
  steps:
    - name: Install analyzer
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Analyze G-code
      shell: bash
      env:
        GSA_PATHS: ${{ inputs.paths }}
        GSA_PROFILE: ${{ inputs.profile }}
        GSA_FORMAT: ${{ inputs.format }}
        GSA_FAIL_ON: ${{ inputs.fail-on }}
      run: python "$GITHUB_ACTION_PATH/action/run.py"
